name: Nightly documentation

on:
  schedule:
    - cron: '17 0 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after a successful build
        type: boolean
        default: true

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  MANIFEST_URL: https://github.com/arm/ai-ml-sdk-manifest.git
  SDK_DIR: ${{ github.workspace }}/sdk
  DOCS_BUILD_DIR: ${{ github.workspace }}/build-docs

jobs:
  build:
    name: Build documentation (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/arm/ml-sdk-linux-arm64:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: Clone repositories
        run: |
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"
          repo init -u "$MANIFEST_URL" --depth=1
          repo sync --no-clone-bundle -j "$(nproc)"

      - name: Record resolved revisions
        run: |
          cd "$SDK_DIR"
          repo manifest -r -o "$GITHUB_WORKSPACE/resolved-manifest.xml"

          {
            echo '### Resolved source revisions'
            echo '```text'
            repo forall -p -c 'git rev-parse HEAD'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build documentation
        run: |
          cmake -S "$SDK_DIR/docs" -B "$DOCS_BUILD_DIR" -G Ninja
          cmake --build "$DOCS_BUILD_DIR" --parallel "$(nproc)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.DOCS_BUILD_DIR }}/docs/out

  build-darwin:
    name: Validate documentation (Darwin)
    runs-on: macos-latest
    timeout-minutes: 120

    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install documentation tools
        run: |
          brew install repo cmake ninja doxygen plantuml
          python -m pip install uv==0.13.4

      - name: Clone repositories
        run: |
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"
          repo init -u "$MANIFEST_URL" --depth=1
          repo sync --no-clone-bundle -j "$(sysctl -n hw.ncpu)"

      - name: Record resolved revisions
        run: |
          cd "$SDK_DIR"
          repo manifest -r -o "$GITHUB_WORKSPACE/resolved-manifest.xml"
          repo forall -p -c 'git rev-parse HEAD'

      - name: Build documentation
        run: |
          cd "$SDK_DIR"
          uv sync --locked --no-install-project --no-default-groups --group sdk
          uv run --no-sync cmake -S docs -B "$DOCS_BUILD_DIR" -G Ninja
          cmake --build "$DOCS_BUILD_DIR" --parallel "$(sysctl -n hw.ncpu)"

  build-windows:
    name: Validate documentation (Windows)
    runs-on: windows-latest
    timeout-minutes: 120

    permissions:
      contents: read

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java for PlantUML
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install documentation tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install -y doxygen.install ninja graphviz plantuml
          "$env:ProgramFiles/doxygen/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ProgramFiles/Graphviz/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $plantumlCli = (Get-Command plantumlc).Source
          $plantumlDir = Join-Path $env:RUNNER_TEMP 'docs-tools'
          New-Item -ItemType Directory -Path $plantumlDir -Force | Out-Null
          "@echo off`r`n`"$plantumlCli`" %*" | Set-Content -Path (Join-Path $plantumlDir 'plantuml.cmd')
          $plantumlDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -m pip install uv==0.13.4
          git clone https://gerrit.googlesource.com/git-repo "$env:GITHUB_WORKSPACE/git-repo"

      - name: Clone repositories
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path $env:SDK_DIR -Force | Out-Null
          Set-Location $env:SDK_DIR
          python "$env:GITHUB_WORKSPACE/git-repo/repo" init --no-repo-verify -u $env:MANIFEST_URL --depth=1
          python "$env:GITHUB_WORKSPACE/git-repo/repo" sync --no-repo-verify --no-clone-bundle -j $env:NUMBER_OF_PROCESSORS

      - name: Record resolved revisions
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:SDK_DIR
          python "$env:GITHUB_WORKSPACE/git-repo/repo" manifest -r -o "$env:GITHUB_WORKSPACE/resolved-manifest.xml"
          python "$env:GITHUB_WORKSPACE/git-repo/repo" forall -p -c 'git rev-parse HEAD'

      - name: Build documentation
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:SDK_DIR
          uv sync --locked --no-install-project --no-default-groups --group sdk
          uv run --no-sync cmake -S docs -B $env:DOCS_BUILD_DIR -G Ninja
          cmake --build $env:DOCS_BUILD_DIR --parallel $env:NUMBER_OF_PROCESSORS

  deploy:
    name: Deploy documentation
    if: github.event_name == 'schedule' || inputs.deploy
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
