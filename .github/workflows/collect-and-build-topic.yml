name: Collect & Build Topic

on:
  workflow_dispatch:
    inputs:
      topic_branch:
        description: "Shared branch name across repos (e.g., feature/foo)"
        required: true
        type: string
  # Allow calling from other repos
  workflow_call:
    inputs:
      topic_branch:
        required: true
        type: string

# - A topic is identified by an Arm-owned shared branch name across the
#   allowlisted Vulkan ML SDK repositories below.
# - Multiple PR updates can trigger the same topic while keeping only the latest build.
concurrency:
  group: topic-ci-${{ inputs.topic_branch }}
  cancel-in-progress: true

jobs:
  collect:
    # - Allow manual and non-PR calls
    # - For PR-triggered calls, require the head branch to be owned by the repository (Arm)
    #   to prevent forks from triggerring across vulkan-ml-sdk repos topic builds.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == github.repository_owner }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      overrides_json: ${{ steps.collect.outputs.overrides_json }}
    steps:
      - name: Collect PRs by branch across org
        id: collect
        env:
          ORG:       ${{ github.repository_owner }}
          TOPIC:     ${{ inputs.topic_branch }}
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find open topic PRs in Arm orgnaization targeting main in Arm vulkan-ml-sdk repositories.
          QUERY_STRING="org:$ORG is:pr is:open base:main head:$TOPIC"

          # Pass the search text as a variable so it cannot alter the GraphQL query.
          QUERY='
          query($q: String!) {
            search(query: $q, type: ISSUE, first: 100) {
              issueCount
              pageInfo {
                hasNextPage
                endCursor
              }
              edges {
                node {
                  ... on PullRequest {
                    number
                    url
                    repository {
                      nameWithOwner
                    }
                    headRepository {
                      nameWithOwner
                    }
                    headRefName
                    headRefOid
                  }
                }
              }
            }
          }'

          # Run the query via gh api, ref: https://docs.github.com/en/issues/planning-and-tracking-with-projects/automating-your-project/using-the-api-to-manage-projects#using-variables
          JSON=$(gh api graphql -f query="$QUERY" -f q="$QUERY_STRING")

          # Only topic changes in Vulkan ML SDK repositories
          ALLOWED_REPOS=$(jq -nc --arg org "$ORG" '[
            $org + "/ai-ml-sdk-for-vulkan",
            $org + "/ai-ml-sdk-vgf-library",
            $org + "/ai-ml-sdk-model-converter",
            $org + "/ai-ml-sdk-scenario-runner",
            $org + "/ai-ml-emulation-layer-for-vulkan",
            $org + "/ai-ml-workload-library-for-vulkan"
          ]')

          # Build a repo->sha map from allowed results and keep this PR only if its repository is in ALLOWED_REPOS
          # TODO: Fail if multiple PRs from the same repository use this topic branch, for now pick the last matching
          echo "$JSON" | jq -r --argjson allowed_repos "$ALLOWED_REPOS" '
            .data.search.edges
            | map(select(.node.repository.nameWithOwner as $repo | $allowed_repos | index($repo)))
            | map(select(.node.headRepository.nameWithOwner == .node.repository.nameWithOwner))
            | map({key: .node.repository.nameWithOwner, value: .node.headRefOid})
            | from_entries
          ' > overrides.json

          # If jq logic above returns null for empty, make an empty object
          if [ ! -s overrides.json ]; then echo "{}" > overrides.json; fi

          # Add the selected pull requests to the workflow summary.
          {
            printf '## Selected topic pull requests\n\nBranch: `%s:%s`\n\n' "$ORG" "$TOPIC"
            printf '| Repository | Pull request | Head SHA |\n| --- | --- | --- |\n'
            echo "$JSON" | jq -r --argjson allowed_repos "$ALLOWED_REPOS" '
              .data.search.edges
              | map(select(.node.repository.nameWithOwner as $repo | $allowed_repos | index($repo)))
              | map(select(.node.headRepository.nameWithOwner == .node.repository.nameWithOwner))
              | sort_by(.node.repository.nameWithOwner)
              | .[]
              | "| `\(.node.repository.nameWithOwner)` | [#\(.node.number)](\(.node.url)) | `\(.node.headRefOid)` |"
            '
          } >> "$GITHUB_STEP_SUMMARY"

          echo "overrides_json=$(cat overrides.json | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: collect
    # Build topics with one or more matching pull requests.
    if: ${{ needs.collect.outputs.overrides_json != '{}' }}
    uses: arm/ai-ml-sdk-for-vulkan/.github/workflows/build-with-manifest.yml@topic-builds
    with:
      overrides_json: ${{ needs.collect.outputs.overrides_json }}
