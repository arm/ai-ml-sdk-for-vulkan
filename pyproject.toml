[project]
name = "ai-ml-sdk-for-vulkan"
version = "0.0.0"
requires-python = ">=3.11,<3.15"

[tool.uv]
package = false

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
force_single_line = true

[dependency-groups]
sdk = [
    "jsonschema==4.26.0",
    "numpy==2.1.3; python_version < '3.14'",
    "numpy==2.5.4; python_version >= '3.14'",
    "Pillow==12.3.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "referencing==0.37.0",
    "argcomplete==3.7.2",
    "breathe==4.36.0",
    "build==1.6.1",
    "debian-inspector==31.1.1",
    "myst_parser==4.0.1",
    "pre-commit==4.7.0",
    "setuptools==84.2.1",
    "sphinx==8.2.3",
    "sphinx_rtd_theme==3.1.0",
    "sphinxcontrib.plantuml==0.31",
    "wheel==0.48.0",
]
docker = ["twine", "dohq-artifactory>=1.0.1,<2"]
